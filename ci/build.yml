name: Build IPA

on:
  push:
    paths:
      - '*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Unpack project
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "unpacking $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          ls -la src | head -20
          du -sh src

      - name: Build
        run: |
          cd src
          set -o pipefail
          xcodebuild \
            -project ZMXY.xcodeproj \
            -scheme ZMXY \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build 2>&1 | tail -n 120

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "src/build/Build/Products/Release-iphoneos/ZMXY.app" Payload/
          zip -qry ZMXY-unsigned.ipa Payload
          ls -lh ZMXY-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZMXY-unsigned-ipa
          path: ZMXY-unsigned.ipa
          retention-days: 30
          if-no-files-found: warn
